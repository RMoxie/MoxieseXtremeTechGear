<script>
    // Check if browser supports notifications and request permission
    function initDailyReminder() {
        if (!("Notification" in window)) {
            console.log("This browser does not support desktop notifications.");
            return;
        }

        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Check the time every minute to see if it's 11:00 AM (11:00)
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 11 && now.getMinutes() === 0) {
                if (Notification.permission === "granted") {
                    new Notification("🔥 Moxies TechGear Reminder", {
                        body: "Time to check out new gear, updates, and products for the site!",
                        icon: "favicon.ico"
                    });
                }
            }
        }, 60000); // Checks every 60 seconds
    }

    // Run on page load
    window.onload = initDailyReminder;
</script>

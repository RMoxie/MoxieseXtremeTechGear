name: Add GA4 tracking

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add GA4 to every HTML page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          measurement_id = "G-H6TMQMLGXP"
          snippet = "\n".join([
              "  <!-- Google tag (gtag.js) -->",
              "  <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-H6TMQMLGXP\"></script>",
              "  <script>",
              "    window.dataLayer = window.dataLayer || [];",
              "    function gtag(){dataLayer.push(arguments);}",
              "    gtag('js', new Date());",
              "    gtag('config', 'G-H6TMQMLGXP');",
              "  </script>",
              "",
          ])

          changed = []
          for path in sorted(Path(".").rglob("*.html")):
              text = path.read_text(encoding="utf-8")
              if measurement_id in text:
                  continue
              if "<head>" not in text:
                  raise RuntimeError(f"Missing <head> in {path}")
              text = text.replace("<head>\n", "<head>\n" + snippet, 1)
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          privacy = Path("privacy.html")
          text = privacy.read_text(encoding="utf-8")
          old = "\n".join([
              "        <h2>3. Cookies and similar technologies</h2>",
              "        <p>The site uses browser storage for certain site-preference functionality, such as remembering the selected light or dark theme. This is a local preference stored by your browser.</p>",
              "        <p>Third-party services, external websites, or future site features may use cookies or similar technologies under their own practices. If the site's use of tracking, analytics, advertising, or other data-collection technology materially changes, this policy will be updated to describe that change.</p>",
          ])
          new = "\n".join([
              "        <h2>3. Cookies, local storage, and analytics</h2>",
              "        <p>The site uses browser storage for certain site-preference functionality, such as remembering the selected light or dark theme. This is a local preference stored by your browser.</p>",
              "        <p>Moxies eXtreme TechGear uses Google Analytics 4 to understand aggregate website traffic and improve guides. Google Analytics may use cookies and collect information such as pages viewed, general device and browser details, approximate location, and referral source. Google processes this information under its own <a href=\"https://policies.google.com/privacy\">Privacy Policy</a>. You can limit cookies through your browser settings or use the <a href=\"https://tools.google.com/dlpage/gaoptout\">Google Analytics Opt-out Browser Add-on</a>.</p>",
          ])
          if old in text:
              privacy.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "Moxies eXtreme TechGear uses Google Analytics 4" not in text:
              raise RuntimeError("Privacy disclosure insertion point not found")

          print(f"Updated {len(changed)} HTML files")
          PY

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Google Analytics 4 tracking site-wide"
            git push
          fi

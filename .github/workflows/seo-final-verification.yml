name: SEO final verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit HTML SEO implementation
        shell: python
        run: |
          import html, pathlib, re
          rows=[]
          for f in sorted(pathlib.Path('.').rglob('*.html')):
              p=f.as_posix()
              if p.startswith('.git/') or p=='404.html': continue
              s=f.read_text(encoding='utf-8',errors='ignore')
              def meta(name):
                  m=re.search(r'<meta[^>]+name=["\']'+re.escape(name)+r'["\'][^>]+content=["\']([^"\']*)',s,re.I|re.S)
                  return html.unescape(m.group(1).strip()) if m else ''
              tm=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
              title=html.unescape(re.sub(r'<[^>]+>','',tm.group(1)).strip()) if tm else ''
              desc=meta('description')
              cm=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',s,re.I|re.S)
                  or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',s,re.I|re.S))
              canonical=cm.group(1) if cm else ''
              h1s=[re.sub(r'<[^>]+>','',x).strip() for x in re.findall(r'<h1[^>]*>(.*?)</h1>',s,re.I|re.S)]
              types=re.findall(r'"@type"\s*:\s*"([^"]+)"',s)
              types=','.join(sorted(set(types)))
              imgs=re.findall(r'<img\b[^>]*>',s,re.I|re.S)
              missing=sum(1 for x in imgs if not re.search(r'\balt\s*=\s*["\'][^"\']*["\']',x,re.I))
              links=re.findall(r'<a\b[^>]+href=["\']([^"\']+)',s,re.I|re.S)
              internal=sum(1 for x in links if x.startswith('/') or x.startswith('./') or x.startswith('../') or (x.startswith('https://moxiesextremetechgear.com')))
              crumb='BreadcrumbList' in types
              rows.append(f'| {p} | {title.replace("|","\\|")} | {desc.replace("|","\\|")} | {canonical} | {len(h1s)} | {h1s[0].replace("|","\\|") if h1s else ""} | {types} | {len(imgs)} | {missing} | {internal} | {crumb} |')
          out='# Final SEO Inventory Audit\n\nGenerated automatically from the repository HTML.\n\n'
          out+='| Page | Title | Description | Canonical | H1 count | H1 | Schema | Images | Missing alt | Internal links | BreadcrumbList |\n|---|---|---|---|---:|---|---|---:|---:|---:|:---:|\n'
          out+='\n'.join(rows)+'\n'
          pathlib.Path('SEO-FINAL-AUDIT.md').write_text(out,encoding='utf-8')
          print('Audited',len(rows),'HTML pages')
      - name: Commit verification report and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEO-FINAL-AUDIT.md
          git rm -f .github/workflows/seo-final-verification.yml
          git commit -m "Refresh final SEO verification audit"
          git push

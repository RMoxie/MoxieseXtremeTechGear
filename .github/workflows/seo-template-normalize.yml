name: SEO template normalization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize indexable HTML SEO structure
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import subprocess
          from urllib.parse import urljoin

          ROOT = 'https://moxiesextremetechgear.com/'
          BRAND = 'Moxies eXtreme TechGear'
          changed = []

          def text_from_tag(pattern, source):
              m = re.search(pattern, source, re.I | re.S)
              return html.unescape(re.sub(r'<[^>]+>', '', m.group(1)).strip()) if m else ''

          def canonical(source):
              m = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', source, re.I)
              if not m:
                  m = re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']', source, re.I)
              return m.group(1) if m else ''

          def page_path(url):
              return url.replace(ROOT, '').lstrip('/') if url.startswith(ROOT) else ''

          def crumbs_for(path, title):
              if path in ('', 'index.html'):
                  return [('Home', ROOT)]
              parts = path.split('/')
              if parts[0] == 'portable-computers':
                  return [('Home', ROOT), ('Computers', ROOT + 'portable-computers/index.html'), (title, None)]
              if parts[0] == 'storage-gear':
                  return [('Home', ROOT), ('Storage Gear', ROOT + 'storage-gear/index.html'), (title, None)]
              if parts[0] == 'audio-gear':
                  return [('Home', ROOT), ('Audio Gear', ROOT + 'audio-gear/index.html'), (title, None)]
              if parts[0] == 'coding-gear':
                  return [('Home', ROOT), ('Software & Coding', ROOT + 'coding-gear/index.html'), (title, None)]
              mapping = {
                  'about.html': 'About & Editorial Standards',
                  'contact.html': 'Contact',
                  'privacy.html': 'Privacy Policy',
                  'affiliate-disclosure.html': 'Affiliate Disclosure',
                  'terms.html': 'Terms of Use',
                  'special-picks.html': 'Special Picks',
                  'offers.html': 'Exclusive Offers',
                  'gan-chargers-guide.html': 'GaN Chargers',
                  'ai-hardware.html': 'AI Hardware',
                  'mobile-power.html': 'Mobile Power',
                  'automotive-emergency.html': 'Auto Safety',
                  'ebike-gear.html': 'E-Bike Gear',
                  'best-electric-bikes.html': 'Best Electric Bikes',
                  'cable-management.html': 'Cable Management',
                  'home-networking-security.html': 'Networking & Security',
                  'monitors-docks-desk-setup.html': 'Desk Setup',
                  'best-100w-usb-c-chargers-travel.html': '100W USB-C Travel Chargers',
                  'airline-safe-power-bank-capacity-guide.html': 'Airline-Safe Power Banks',
                  'wifi-7-vs-wifi-6e-guide.html': 'Wi-Fi 7 vs Wi-Fi 6E',
                  'local-ai-gpu-vram-guide.html': 'Local AI GPU VRAM',
                  'best-usb-c-docks-dual-monitors.html': 'USB-C Docks',
                  'best-locks-for-ebikes.html': 'E-Bike Locks',
              }
              return [('Home', ROOT), (mapping.get(path, title), None)]

          for file in sorted(pathlib.Path('.').rglob('*.html')):
              rel = file.as_posix()
              if rel.startswith('.git/') or rel == '404.html':
                  continue
              source = file.read_text(encoding='utf-8')
              if 'rel="canonical"' not in source.lower():
                  continue
              can = canonical(source)
              if not can.startswith(ROOT):
                  continue
              title = text_from_tag(r'<title[^>]*>(.*?)</title>', source) or pathlib.Path(rel).stem
              title = re.sub(r'\s*\|\s*' + re.escape(BRAND) + r'\s*$', '', title, flags=re.I).strip()
              path = page_path(can)
              crumbs = crumbs_for(path, title)

              # Standardize visible breadcrumbs unless one already exists.
              if not re.search(r'class=["\'][^"\']*breadcrumb', source, re.I):
                  items = []
                  for i, (name, href) in enumerate(crumbs):
                      if href:
                          items.append(f'<a href="{href}">{html.escape(name)}</a>')
                      else:
                          items.append(f'<span aria-current="page">{html.escape(name)}</span>')
                  breadcrumb = ('<nav class="site-breadcrumb" aria-label="Breadcrumb">' +
                                ' <span class="site-breadcrumb-sep" aria-hidden="true">›</span> '.join(items) +
                                '</nav>')
                  source = re.sub(r'(<main\b[^>]*>)', r'\1' + breadcrumb, source, count=1, flags=re.I)

              # Add one BreadcrumbList graph entry when absent.
              if not re.search(r'"@type"\s*:\s*"BreadcrumbList"', source, re.I):
                  elements = []
                  for i, (name, href) in enumerate(crumbs, 1):
                      item = {'@type': 'ListItem', 'position': i, 'name': name}
                      if href:
                          item['item'] = href
                      elements.append(item)
                  schema = {'@context': 'https://schema.org', '@type': 'BreadcrumbList', 'itemListElement': elements}
                  block = '<script type="application/ld+json">' + json.dumps(schema, separators=(',', ':')) + '</script>'
                  source = re.sub(r'</head>', block + '</head>', source, count=1, flags=re.I)

              # Add a compact, consistent breadcrumb style to pages that don't already define it.
              if '.site-breadcrumb{' not in source and '.site-breadcrumb {' not in source:
                  css = '<style id="seo-breadcrumb-style">.site-breadcrumb{width:min(1180px,calc(100% - 2rem));margin:.8rem auto 0;padding:.35rem 0;color:var(--text-muted,#64748b);font-size:.9rem}.site-breadcrumb a{color:var(--accent,#0284c7);text-decoration:none}.site-breadcrumb a:hover{text-decoration:underline}.site-breadcrumb span[aria-current="page"]{font-weight:700;color:var(--text-main,#0f172a)}</style>'
                  source = re.sub(r'</head>', css + '</head>', source, count=1, flags=re.I)

              # Ensure the current official brand appears in the site-name metadata where those tags exist.
              source = re.sub(r'(<meta\s+property=["\']og:site_name["\']\s+content=["\'])[^"\']*(["\'])', r'\g<1>' + BRAND + r'\2', source, flags=re.I)

              new = source
              if new != file.read_text(encoding='utf-8'):
                  file.write_text(new, encoding='utf-8')
                  changed.append(rel)

          # Add a short marker file describing the automated normalization run.
          pathlib.Path('SEO-NORMALIZATION-LOG.md').write_text(
              '# SEO normalization log\n\nThis file records that the master SEO normalization pass added/standardized visible breadcrumbs and BreadcrumbList structured data across indexable HTML pages.\n\nThe repository master template is documented in `SEO-MASTER-TEMPLATE.md`.\n',
              encoding='utf-8')

          if changed:
              print('Changed:', *changed, sep='\n- ')
          else:
              print('No HTML changes required.')

      - name: Commit normalized SEO structure and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/seo-template-normalize.yml || true
          git commit -m "Standardize SEO template, breadcrumbs, and schema" || exit 0
          git push

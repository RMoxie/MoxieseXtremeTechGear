name: SEO editorial normalization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize editorial titles and Article schema
        shell: python
        run: |
          import html, json, pathlib, re
          ROOT='https://moxiesextremetechgear.com/'
          article_pages={
            'audio-gear.html','audio-gear/headset-guide.html','cable-management.html',
            'gan-chargers-guide.html','mobile-power.html','automotive-emergency.html',
            'ebike-gear.html','home-networking-security.html','monitors-docks-desk-setup.html',
            'storage-gear/ssd-guide.html','storage-gear/storage-gear.html',
            'coding-gear/keyboard-guide.html','coding-gear/mouse-guide.html',
          }
          changed=[]
          for p in sorted(article_pages):
              f=pathlib.Path(p)
              if not f.exists():
                  continue
              s=f.read_text(encoding='utf-8')
              original=s

              if p == 'cable-management.html':
                  s=re.sub(r'<title>\s*Cable Management &amp; Power Delivery Guide\s*</title>',
                           '<title>Cable Management &amp; Power Delivery Guide | Moxies eXtreme TechGear</title>', s, count=1, flags=re.I)

              if not re.search(r'<meta[^>]+property=["\']og:site_name["\']', s, re.I):
                  s=re.sub(r'</head>', '<meta property="og:site_name" content="Moxies eXtreme TechGear">\n</head>', s, count=1, flags=re.I)

              if not re.search(r'"@type"\s*:\s*"Article"', s):
                  cm=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',s,re.I|re.S)
                      or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',s,re.I|re.S))
                  tm=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
                  dm=re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']*)',s,re.I|re.S)
                  im=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',s,re.I|re.S)
                  date=re.search(r'"dateModified"\s*:\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"',s,re.I|re.S)
                  if cm and tm:
                      url=cm.group(1)
                      title=html.unescape(re.sub(r'<[^>]+>','',tm.group(1)).strip())
                      desc=html.unescape(dm.group(1).strip()) if dm else ''
                      headline=re.sub(r'\s*\|\s*Moxies eXtreme TechGear\s*$','',title,flags=re.I)
                      data={'@context':'https://schema.org','@type':'Article','headline':headline,'description':desc,'url':url,
                            'author':{'@type':'Person','name':'Moxie','url':ROOT+'about.html'},
                            'publisher':{'@type':'Organization','name':'Moxies eXtreme TechGear','url':ROOT}}
                      if date: data['dateModified']=date.group(1)
                      if im: data['image']=im.group(1)
                      block='<script type="application/ld+json">'+json.dumps(data,separators=(',',':'))+'</script>'
                      s=re.sub(r'</head>',block+'</head>',s,count=1,flags=re.I)

              if s != original:
                  f.write_text(s,encoding='utf-8')
                  changed.append(p)
          print('Changed:', *changed, sep='\n  ')

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/seo-editorial-normalize.yml
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Normalize editorial SEO titles and schema"
          git push

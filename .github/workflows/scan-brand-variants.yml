name: Correct brand variants

on:
  push:
    paths:
      - '.github/workflows/scan-brand-variants.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct brand references
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, re
          suffixes = {'.html', '.css', '.js', '.json', '.xml', '.txt', '.svg', '.md', '.yml', '.yaml'}
          pattern = re.compile(r'(?i)\bmoxies?\s+(?:e?xtreme\s+)?tech\s*[- ]?\s*gear\b')
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          replacement = 'Moxies eXtreme TechGear'
          for name in files:
              if not name or name in {'.github/workflows/scan-brand-variants.yml', 'brand-scan-report.txt'}:
                  continue
              p = Path(name)
              if p.suffix.lower() not in suffixes:
                  continue
              try:
                  data = p.read_bytes()
                  text = data.decode('utf-8')
              except Exception:
                  continue
              new_text = pattern.sub(replacement, text)
              if new_text != text:
                  p.write_bytes(new_text.encode('utf-8'))
                  changed.append(name)
          print('Changed files:')
          for name in changed:
              print(name)
          print(f'Total changed: {len(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: standardize site brand references' || true
          git push

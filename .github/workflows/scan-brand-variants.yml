name: Verify brand sweep

on:
  push:
    paths:
      - '.github/workflows/scan-brand-variants.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no noncanonical brand phrases remain
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, re, sys
          suffixes = {'.html', '.css', '.js', '.json', '.xml', '.txt', '.svg', '.md', '.yml', '.yaml'}
          pattern = re.compile(r'(?i)\bmoxies?\s+(?:e?xtreme\s+)?tech\s*[- ]?\s*gear\b')
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          bad = []
          for name in files:
              if not name or name in {'.github/workflows/scan-brand-variants.yml', 'brand-scan-report.txt'}:
                  continue
              p = Path(name)
              if p.suffix.lower() not in suffixes:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  for match in pattern.finditer(line):
                      if match.group(0) != 'Moxies eXtreme TechGear':
                          bad.append(f'{name}:{number}:{match.group(0)}')
          if bad:
              print('NONCANONICAL BRAND REFERENCES FOUND:')
              print('\n'.join(bad))
              sys.exit(1)
          print('BRAND SWEEP VERIFIED: all matching brand phrases use "Moxies eXtreme TechGear".')
          PY

name: Unified TechGear Automation

on:
  schedule:
    - cron: "0 9 * * *"   # Daily at 9 AM
  workflow_dispatch:

jobs:
  unified-techgear:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      name: install dependencies 
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
       Node.js version 24
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run audit + rebuild scripts
      run: |
        python audit-products.py
        python rebuild-pages.py
        python update-categories.py
        python generate-dashboard.py

    - name: Configure git
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

    - name: Stage changes
      run: git add .

    - name: Commit changes only if needed
      run: |
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Unified TechGear daily update"
          git push
        fi


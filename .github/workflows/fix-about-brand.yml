name: Fix About page brand

on:
  push:
    paths:
      - '.github/workflows/fix-about-brand.yml'

permissions:
  contents: write

jobs:
  fix-about-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Correct About page branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'About &amp; Editorial Standards | Moxies TechGear': 'About &amp; Editorial Standards | Moxies eXtreme TechGear',
          }
          for old, new in replacements.items():
              if text.count(old) != 3:
                  raise SystemExit(f'Expected exactly 3 branding occurrences, found {text.count(old)}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Standardize About page brand name'
          git push

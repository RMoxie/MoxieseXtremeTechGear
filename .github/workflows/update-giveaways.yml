name: Update daily giveaways

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-giveaways
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python scripts/update-giveaways.py
      - name: Publish refreshed giveaway data
        run: |
          if git diff --quiet -- giveaway-data.json; then
            echo "Giveaway data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giveaway-data.json
          git commit -m "Refresh daily giveaway previews"
          git push

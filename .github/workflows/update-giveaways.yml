name: Update daily giveaways

on:
  schedule:
    - cron: '17 12 * * *' # Daily at 12:17 UTC, after the offers rotate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-giveaways
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate all four offers
        run: python scripts/update_giveaways.py
      - name: Commit data only when changed
        run: |
          if git diff --quiet -- giveaway-data.json; then
            echo "JSON unchanged; no commit created."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- giveaway-data.json
          git commit -m 'Update daily giveaway data' -- giveaway-data.json
          git push origin HEAD:main
          echo "Commit created for giveaway-data.json."
